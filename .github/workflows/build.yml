name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: for s in templates/*/*.sh tools/*.sh tests/run.sh; do sh -n "$s"; done
      - name: Host tests (LED drivers, MIDI parser)
        run: tests/run.sh
      - name: Device builds (zig, aarch64)
        run: |
          pip install ziglang==0.14.1
          make -C tools
          make -C examples/skeleton package
          file tools/build/evdump tools/build/joydump examples/skeleton/build/trimui/skeleton | tee /dev/stderr | grep -c "ARM aarch64" | grep -qx 3
          # the MustardOS package (the only one built): the binary and its launchers
          for f in skeleton launch.sh mux_launch.sh wake_screen.sh sysinfo.sh glyph/skeleton.svg; do
            unzip -l examples/skeleton/build/Skeleton-mustardos.muxapp | grep -q "Skeleton/$f$" || { echo "::error::no $f"; exit 1; }
          done
